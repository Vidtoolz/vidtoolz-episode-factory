<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presenter section boundary review</title>
<style>
body{font:16px system-ui,sans-serif;max-width:980px;margin:24px auto;padding:0 16px;background:#101214;color:#eee}button{padding:9px 14px;margin:4px;border:1px solid #777;border-radius:6px;background:#25292d;color:#fff}button.confirm{background:#145c34}button:disabled{opacity:.45}.card{border:1px solid #3c4248;border-radius:10px;padding:16px;margin:14px 0;background:#181b1e}.confirmed{border-color:#2f9e61}.script{color:#d8d8d8}.status{font-weight:700}.controls{display:flex;flex-wrap:wrap;gap:4px}.edge{margin:8px 0;padding:8px;background:#202428;border-radius:6px}.time{font-variant-numeric:tabular-nums;color:#9fd}video{width:100%;max-height:420px;background:#000}small{color:#aaa}
</style></head><body>
<h1>Human performance boundaries</h1><p>Play the proposed section, adjust either edge if needed, then confirm once. A machine proposal is never production authority until this confirmation.</p>
<div id="summary"></div><video id="player" controls preload="metadata"></video><div id="sections"></div>
<script>
let state,nonce;const player=document.querySelector('#player');
const fmt=ms=>`${Math.floor(ms/60000)}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}.${String(ms%1000).padStart(3,'0')}`;
async function api(action,body){const r=await fetch('/api/'+action,{method:'POST',headers:{'content-type':'application/json','x-boundary-review-nonce':nonce},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error+': '+j.detail);state=j;render()}
function play(s,mode){player.src='/media/'+encodeURIComponent(s.master_id);const pre=mode==='start'?3000:mode==='end'?2000:0,post=mode==='start'?2000:mode==='end'?3000:0;const a=Math.max(0,s.current.in_ms-pre),b=Math.min(state.masters.find(m=>m.master_id===s.master_id).duration_ms,s.current.out_ms+post);player.currentTime=a/1000;player.play();const stop=()=>{if(player.currentTime>=b/1000){player.pause();player.removeEventListener('timeupdate',stop)}};player.addEventListener('timeupdate',stop)}
function render(){const done=state.sections.filter(s=>s.state==='CONFIRMED').length;document.querySelector('#summary').innerHTML=`<p class=status>${done}/${state.sections.length} HUMAN_CONFIRMED</p><small>Story ${state.story.version_id} · VP2 ${state.visual_plan.digest_sha256.slice(0,12)}…</small>`;document.querySelector('#sections').innerHTML='';for(const s of [...state.sections].sort((a,b)=>a.story_order-b.story_order)){const d=document.createElement('div');d.className='card '+(s.state==='CONFIRMED'?'confirmed':'');d.innerHTML=`<h2>S${String(s.story_order).padStart(2,'0')} · ${s.master_id}</h2><p class=script>${s.approved_script_excerpt}</p><p class=status>${s.state==='CONFIRMED'?'✓ HUMAN_CONFIRMED':'Machine proposal — confirmation required'}</p><div class=edge>Start <span class=time>${fmt(s.current.in_ms)}</span><div class=controls><button data-a="in_ms,-250">Earlier</button><button data-a="in_ms,250">Later</button><button data-play=start>Play start</button></div></div><div class=edge>End <span class=time>${fmt(s.current.out_ms)}</span><div class=controls><button data-a="out_ms,-250">Earlier</button><button data-a="out_ms,250">Later</button><button data-play=end>Play end</button></div></div><div class=controls><button data-play=section>Play section</button><button data-reset>Reset proposal</button><button class=confirm data-confirm>Confirm section</button></div><small>Planned: ${s.planned_framing} · Captured: ${s.captured_framing}</small>`;d.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const [edge,delta]=b.dataset.a.split(',');api('adjust',{section_id:s.section_id,edge,delta_ms:Number(delta)}).catch(alert)});d.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>play(s,b.dataset.play));d.querySelector('[data-reset]').onclick=()=>api('reset',{section_id:s.section_id}).catch(alert);d.querySelector('[data-confirm]').onclick=()=>api('confirm',{section_id:s.section_id}).catch(alert);document.querySelector('#sections').appendChild(d)}}
fetch('/api/session').then(r=>r.json()).then(j=>{state=j;nonce=j.write_nonce;delete state.write_nonce;render()}).catch(e=>document.body.append(e.message));
</script></body></html>
